name: Build desktop app

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: charlie-windows
          - os: macos-latest
            artifact_name: charlie-macos
          - os: ubuntu-latest
            artifact_name: charlie-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux audio deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev espeak-ng

      - name: Install macOS audio deps
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install Python deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build executable
        run: pyinstaller --onefile --name charlie --add-data "apps.json${{ runner.os == 'Windows' && ';' || ':' }}." charlie_pc.py

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: desktop/dist/*

      # Windows also gets a real Setup.exe (Start Menu shortcut, optional
      # desktop icon, "Add or Remove Programs" entry) on top of the raw
      # portable exe above — see installer/charlie.iss for what it does and
      # doesn't touch. Inno Setup 6 ships preinstalled on windows-latest
      # runners, so there's nothing extra to install here.
      - name: Compile Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" installer\charlie.iss

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: charlie-windows-installer
          path: desktop/installer/dist_installer/CharlieSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip each portable build
        run: |
          cd artifacts
          for dir in charlie-windows charlie-macos charlie-linux; do
            [ -d "$dir" ] && zip -r -j "../${dir}.zip" "$dir"
          done

      # charlie_pc.py's own auto-updater fetches this exact SHA256SUMS.txt to
      # verify whatever it downloads before applying it — see
      # _expected_sha256() in desktop/charlie_pc.py. Computed here, in the
      # same run that builds and uploads the assets, from the exact bytes
      # about to be released.
      - name: Stage the plain script and compute checksums
        run: |
          cp desktop/charlie_pc.py charlie_pc.py
          sha256sum charlie-windows.zip charlie-macos.zip charlie-linux.zip \
            artifacts/charlie-windows-installer/CharlieSetup.exe charlie_pc.py \
            | awk '{ name = $2; sub(/.*\//, "", name); print $1, name }' > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
            artifacts/charlie-windows-installer/CharlieSetup.exe
            charlie_pc.py
            SHA256SUMS.txt
